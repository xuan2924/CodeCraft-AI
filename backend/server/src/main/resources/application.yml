server:
  address: 127.0.0.1
  port: ${JAVA_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    threads:
      max: 16
      min-spare: 2
    max-connections: 64
    accept-count: 16
spring:
  application:
    name: codecraft-server
  datasource:
    url: jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5432}/${POSTGRES_DB:codecraft}?connectTimeout=2&socketTimeout=3
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      connection-timeout: 2000
      validation-timeout: 1000
  flyway:
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
mybatis:
  configuration:
    default-statement-timeout: 2
    local-cache-scope: STATEMENT
workspace:
  sandbox-host: ${SANDBOX_HOST:127.0.0.1}
  sandbox-port: ${SANDBOX_PORT:9090}
  publication-file: ${PROBLEM_PUBLICATION_FILE:}
  rpc-key: ${SANDBOX_RPC_KEY:}
tracer:
  sandbox-host: ${SANDBOX_HOST:127.0.0.1}
  sandbox-port: ${SANDBOX_PORT:9090}
identity:
  public-origin: ${PUBLIC_ORIGIN:http://localhost:5173}
  fingerprint-key: ${IDENTITY_FINGERPRINT_KEY:}
  bootstrap-username: ${BOOTSTRAP_ADMIN_USERNAME:}
  bootstrap-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
copilot:
  web:
    api-key: ${COPILOT_WEB_API_KEY:}
    base-url: ${COPILOT_WEB_BASE_URL:https://api.tavily.com/}
    timeout: ${COPILOT_WEB_TIMEOUT:20s}
model:
  credential-rotation:
    enabled: ${MODEL_CREDENTIAL_ROTATION_ENABLED:false}
  security:
    active-key-id: ${MODEL_CREDENTIAL_ACTIVE_KEY_ID:}
    keys: ${MODEL_CREDENTIAL_KEYS:}
