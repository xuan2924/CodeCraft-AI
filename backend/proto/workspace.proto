syntax = "proto3";

package codecraft.workspace.v1;
option java_package = "ai.codecraft.workspace.v1";
option java_multiple_files = true;
option go_package = "codecraft.local/sandbox/internal/gen;statusv1";

// Trusted Java-to-Go calls only. Public browser authorization belongs to Java.
service WorkspaceStorage {
  rpc PrepareWorkspace(PrepareWorkspaceRequest) returns (WorkspaceSnapshot);
  rpc QueryWorkspace(QueryWorkspaceRequest) returns (WorkspaceSnapshot);
  // Durable deletion fence; repeated calls finish cleanup without reopening the instance.
  rpc DeleteWorkspace(QueryWorkspaceRequest) returns (WorkspaceDeletionReceipt);
  // Java supplies a consistent reference snapshot; a stale current revision rejects collection.
  rpc CollectWorkspace(CollectWorkspaceRequest) returns (WorkspaceCollectionReceipt);
  rpc PruneTestEvidence(QueryTaskRequest) returns (TestEvidencePruningReceipt);
  rpc PruneCommandEvidence(QueryTaskRequest) returns (TestEvidencePruningReceipt);
  // Scope is monotonic at the durable meter; delayed subset requests never forget old owners.
  rpc MeasureExerciseStorage(MeasureExerciseStorageRequest) returns (StorageMeasurement);
  rpc ReadWorkspaceFile(ReadWorkspaceFileRequest) returns (ReadWorkspaceFileResponse);
  rpc GrepWorkspace(GrepWorkspaceRequest) returns (GrepWorkspaceResponse);
  // Pure historical comparison / restore preview; publication still uses ApplyBatch.
  rpc PreviewWorkspaceHistory(WorkspaceHistoryRequest) returns (WorkspaceHistoryPreview);
  rpc CancelPreparation(CancelPreparationRequest) returns (WorkspaceSnapshot);
  rpc CloseGate(CloseGateRequest) returns (GateResponse);
  rpc QueryGate(QueryWorkspaceRequest) returns (GateResponse);
  rpc OpenGate(CloseGateRequest) returns (GateResponse);
  rpc Freeze(CloseGateRequest) returns (GateResponse);
  rpc QueryFreeze(QueryWorkspaceRequest) returns (GateResponse);
  rpc ApplyBatch(ApplyBatchRequest) returns (MutationReceipt);
  rpc QueryMutation(QueryMutationRequest) returns (MutationReceipt);
  // Internal input preparation only; these calls never register or start an execution.
  rpc PrepareTestCopy(PrepareTestCopyRequest) returns (TestCopyReceipt);
  rpc QueryTestCopy(QueryTestCopyRequest) returns (TestCopyReceipt);
  rpc StartTest(StartTestRequest) returns (TestTaskSnapshot);
  // Development commands never constitute authority-test evidence.
  rpc StartCommand(StartCommandRequest) returns (CommandSnapshot);
  rpc QueryCommand(QueryTaskRequest) returns (CommandSnapshot);
  rpc SynchronizeCommand(QueryTaskRequest) returns (CommandSnapshot);
  rpc ReadCommandChanges(QueryTaskRequest) returns (CommandChanges);
  rpc QueryTask(QueryTaskRequest) returns (TestTaskSnapshot);
  rpc StopTask(StopTaskRequest) returns (StopTaskResponse);
  // Trusted lifecycle cancellation; never exposed as browser-selected authority.
  rpc StopSystemTask(QueryTaskRequest) returns (StopTaskResponse);
  rpc QueryStop(QueryTaskRequest) returns (StopTaskResponse);
  rpc ListExecutions(ExecutionInventoryRequest) returns (ExecutionInventory);
  rpc ReconcileTask(QueryTaskRequest) returns (TestTaskSnapshot);
  rpc WatchTask(WatchTaskRequest) returns (stream TaskEvent);
  // Attach only to an already admitted terminal command. Java owns browser authority.
  rpc AttachTerminal(stream TerminalClientFrame) returns (stream TerminalServerFrame);
  // Explicit opt-in commit request, fenced by the original gate/revision authority.
  rpc SyncTerminal(QueryTaskRequest) returns (CommandSnapshot);
}

message ProblemIdentity {
  string problem_id = 1;
  string version = 2;
  string package_sha256 = 3;
  string execution_image_digest = 4;
  string platform = 5;
}
message PrepareWorkspaceRequest {
  string workspace_instance_id = 1;
  string operation_id = 2;
  ProblemIdentity problem = 3;
  // Conservative initiating-session deadline; Java also rechecks authoritative identity state.
  int64 not_after_unix_millis = 4;
}
message QueryWorkspaceRequest { string workspace_instance_id = 1; }
message WorkspaceDeletionReceipt {
  string workspace_instance_id = 1;
  bool complete = 2;
}
message CollectWorkspaceRequest {
  string workspace_instance_id = 1;
  uint64 expected_revision = 2;
  repeated uint64 retained_revisions = 3;
}
message WorkspaceCollectionReceipt {
  string workspace_instance_id = 1;
  uint64 revision = 2;
  uint64 removed_versions = 3;
  uint64 reclaimed_bytes = 4;
}
message TestEvidencePruningReceipt {
  string workspace_instance_id = 1;
  string task_id = 2;
  string execution_instance_id = 3;
  bool complete = 4;
}
message MeasureExerciseStorageRequest {
  string exercise_id = 1;
  repeated string workspace_instance_ids = 2;
  repeated QueryTaskRequest executions = 3;
}
message StorageMeasurement {
  string exercise_id = 1;
  string meter_epoch = 2;
  uint64 sequence = 3;
  uint64 bytes = 4;
}
message ReadWorkspaceFileRequest {
  string workspace_instance_id = 1;
  string path = 2;
  uint64 expected_revision = 3;
}
message ReadWorkspaceFileResponse {
  string workspace_instance_id = 1;
  uint64 revision = 2;
  string path = 3;
  string content = 4;
}
// Search only the verified published tree at an exact saved revision.
message GrepWorkspaceRequest {
  string workspace_instance_id = 1;
  uint64 expected_revision = 2;
  string pattern = 3;
  string path_prefix = 4;
  bool is_regex = 5;
  uint32 context_lines = 6;
  uint32 limit = 7;
}
message GrepWorkspaceResponse {
  string workspace_instance_id = 1;
  uint64 revision = 2;
  repeated string lines = 3;
  bool truncated = 4;
}
message CancelPreparationRequest {
  string workspace_instance_id = 1;
  string operation_id = 2;
}
message CloseGateRequest {
  string workspace_instance_id = 1;
  string transition_id = 2;
  uint64 expected_epoch = 3;
}
message GateResponse {
  string workspace_instance_id = 1;
  string transition_id = 2;
  uint64 epoch = 3;
  string state = 4;
  // Only meaningful for FROZEN; transition_id identifies the freeze operation.
  uint64 frozen_revision = 5;
}
// CREATE and DELETE together represent an atomic rename. Duplicate paths are rejected.
message FileChange {
  string path = 1;
  string kind = 2; // CREATE, UPDATE, DELETE
  string content = 3; // DELETE must be empty
}
message ApplyBatchRequest {
  string workspace_instance_id = 1;
  string request_id = 2;
  string operation_id = 3;
  uint64 expected_revision = 4;
  uint64 gate_epoch = 5;
  int64 not_after_unix_millis = 6;
  repeated FileChange changes = 7;
}
message QueryMutationRequest {
  string workspace_instance_id = 1;
  string request_id = 2;
}
// NOT_FOUND is only a linearized observation, never permission to replay a write.
// Fingerprint is computed by Go over the canonical business payload, not authorization.
message MutationReceipt {
  string workspace_instance_id = 1;
  string request_id = 2;
  string operation_id = 3;
  string fingerprint = 4;
  uint64 revision = 5;
  bool changed = 6;
}
message PrepareTestCopyRequest {
  string workspace_instance_id = 1;
  string execution_instance_id = 2;
  uint64 expected_revision = 3;
  uint64 gate_epoch = 4;
  int64 not_after_unix_millis = 5;
  FinalVerificationAuthority final_verification = 6;
}
message FinalVerificationAuthority {
  string finalization_id = 1;
  string attempt_id = 2;
  string freeze_operation_id = 3;
  int64 deadline_unix_millis = 4;
}
message QueryTestCopyRequest {
  string workspace_instance_id = 1;
  string execution_instance_id = 2;
}
// The relative path is private Go storage metadata, never a browser mount input.
message TestCopyReceipt {
  string workspace_instance_id = 1;
  string execution_instance_id = 2;
  uint64 revision = 3;
  ProblemIdentity problem = 4;
  string relative_path = 5;
}
// All IDs and authority originate in Java; runtime configuration comes from publication.
message StartTestRequest {
  string exercise_id = 1;
  string task_id = 2;
  string execution_instance_id = 3;
  string workspace_instance_id = 4;
  uint64 expected_revision = 5;
  string target = 6;
  string purpose = 7; // MANUAL or FINAL_VERIFICATION; never browser supplied.
  uint64 gate_epoch = 8;
  int64 not_after_unix_millis = 9;
  string host_epoch = 10; // Opaque durable boot generation; never reused after restart.
  FinalVerificationAuthority final_verification = 11;
}
message StartCommandRequest {
  string exercise_id = 1;
  string task_id = 2;
  string execution_instance_id = 3;
  string workspace_instance_id = 4;
  uint64 expected_revision = 5;
  uint64 gate_epoch = 6;
  int64 not_after_unix_millis = 7;
  string host_epoch = 8;
  string command = 9;
  string directory = 10;
  bool terminal = 11;
}

message TerminalOpen {
  QueryTaskRequest identity = 1;
  uint64 gate_epoch = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  string term = 5;
}
message TerminalSize { uint32 cols = 1; uint32 rows = 2; }
message TerminalClientFrame {
  oneof frame {
    TerminalOpen open = 1;
    bytes stdin = 2;
    TerminalSize resize = 3;
    bool heartbeat = 4;
    bool sync = 5;
  }
}
message TerminalServerFrame {
  oneof frame {
    bool opened = 1;
    bytes output = 2;
    CommandSnapshot exit = 3;
    string error = 4;
  }
}
message CommandSnapshot {
  TestTaskSnapshot execution = 1;
  string synchronization = 2; // PENDING, SYNCED, UNCHANGED, CONFLICT, REJECTED
  string synchronization_reason = 3;
  MutationReceipt mutation = 4;
}
message WorkspaceFileDifference {
  FileChange change = 1;
  string previous_content = 2;
}
message CommandChanges {
  string workspace_instance_id = 1;
  string execution_instance_id = 2;
  uint64 base_revision = 3;
  repeated WorkspaceFileDifference changes = 4;
}
message WorkspaceHistoryRequest {
  string workspace_instance_id = 1;
  uint64 base_revision = 2;
  uint64 result_revision = 3;
  uint64 expected_revision = 4;
  // DIFF: recorded change; UNDO: inverse on current; ROLLBACK: selected version on current.
  string mode = 5;
  // ROLLBACK only: must equal base_revision or result_revision.
  uint64 target_revision = 6;
}
message WorkspaceHistoryPreview {
  string workspace_instance_id = 1;
  uint64 base_revision = 2;
  uint64 result_revision = 3;
  uint64 current_revision = 4;
  string mode = 5;
  repeated WorkspaceFileDifference changes = 6;
  repeated string conflicts = 7;
  // SHA-256 of the deterministic protobuf projection before this field is set.
  string fingerprint = 8;
  // Only meaningful for ROLLBACK (UNDO does not recreate a whole old version).
  uint64 target_revision = 9;
}
message QueryTaskRequest {
  string exercise_id = 1;
  string task_id = 2;
  string execution_instance_id = 3;
  string workspace_instance_id = 4;
  uint64 observed_state_version = 5; // Reconcile only: Java's already committed high-water mark.
}
// Stop authority uses the current page gate, not the task's historical start gate.
message StopTaskRequest {
  QueryTaskRequest task = 1;
  uint64 gate_epoch = 2;
  int64 not_after_unix_millis = 3;
}
message StopTaskResponse {
  // Absent registration is durably cancelled; a delayed Start cannot run.
  bool cancelled_before_registration = 1;
  TestTaskSnapshot snapshot = 2;
  string host_epoch = 3; // Generation that accepted or observed this cancellation.
}
message ExecutionInventoryRequest {
  string after_execution_id = 1;
  uint32 limit = 2; // 1..100
  string host_epoch = 3; // Empty on the first page; bind subsequent pages.
}
message ExecutionInventoryEntry {
  QueryTaskRequest task = 1;
  string state = 2;
  bool quiescent = 3;
  string cleanup = 4;
  string copy_cleanup = 5;
}
message ExecutionInventory {
  string host_epoch = 1;
  repeated ExecutionInventoryEntry entries = 2;
  string next_execution_id = 3;
}
message WatchTaskRequest {
  QueryTaskRequest task = 1;
  string stream_id = 2;
  uint64 after_sequence = 3;
}
message TaskEvent {
  uint32 schema_version = 1;
  string task_id = 2;
  string execution_instance_id = 3;
  string stream_id = 4;
  uint64 sequence = 5;
  string type = 6;
  int64 occurred_at_unix_millis = 7;
  string channel = 8;
  bytes data = 9;
  string state = 10;
  uint64 dropped_bytes = 11;
}
message TestLogChunk {
  string channel = 1;
  bytes data = 2;
}
message TestEvidence {
  string kind = 1;
  string sha256 = 2;
  uint64 bytes = 3;
}
message TestTaskSnapshot {
  string exercise_id = 1;
  string task_id = 2;
  string execution_instance_id = 3;
  string workspace_instance_id = 4;
  uint64 revision = 5;
  string target = 6;
  ProblemIdentity problem = 7;
  string state = 8;
  string reason = 9;
  int64 started_at_unix_millis = 10;
  optional int64 finished_at_unix_millis = 11;
  optional int32 exit_code = 12;
  bool quiescent = 13;
  string cleanup = 14;
  string copy_cleanup = 15;
  repeated TestLogChunk logs = 16;
  uint64 dropped_bytes = 17;
  bool logs_incomplete = 18;
  TestEvidence evidence = 19;
  string stream_id = 20;
  uint64 sequence = 21;
  uint64 first_retained_sequence = 22;
  uint64 state_version = 23;
}
message WorkspaceSnapshot {
  string workspace_instance_id = 1;
  string operation_id = 2;
  ProblemIdentity problem = 3;
  uint64 revision = 4;
  bool prepared = 5;
  bool cancelled = 6;
  repeated string paths = 7;
}
