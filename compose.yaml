services:
  java:
    image: ${JAVA_IMAGE:-codecraft/java:unbuilt}
    pull_policy: never
    platform: linux/amd64
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      JAVA_PORT: "8080"
      SANDBOX_HOST: sandbox
      SANDBOX_PORT: "9090"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codecraft}?connectTimeout=2&socketTimeout=3
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      IDENTITY_FINGERPRINT_KEY: ${IDENTITY_FINGERPRINT_KEY:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5173}
      SANDBOX_RPC_KEY: ${SANDBOX_RPC_KEY:-}
      PROBLEM_PUBLICATION_FILE: ${JAVA_PUBLICATION_FILE:-}
    ports:
      - "127.0.0.1:${JAVA_PORT:-8080}:8080"
  sandbox:
    image: ${SANDBOX_IMAGE:-codecraft/sandbox:unbuilt}
    pull_policy: never
    platform: linux/amd64
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SANDBOX_PORT: "9090"
      SANDBOX_RPC_KEY: ${SANDBOX_RPC_KEY:-}
    ports:
      - "127.0.0.1:${SANDBOX_PORT:-9090}:9090"
    volumes:
      - sandbox-data:/var/lib/codecraft
  postgres:
    image: postgres@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codecraft}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  sandbox-data:
  postgres-data:
