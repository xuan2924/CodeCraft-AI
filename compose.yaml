services:
  java:
    image: ${JAVA_IMAGE:-codecraft/java:unbuilt}
    pull_policy: never
    platform: linux/amd64
    user: "10001:10001"
    read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
      rabbitmq:
        condition: service_healthy
        required: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      JAVA_PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REALTIME_BACKEND: ${REALTIME_BACKEND:-local}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-postgresql}
      ASYNC_BACKEND: ${ASYNC_BACKEND:-local}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-codecraft}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      SANDBOX_NODES: ${SANDBOX_NODES:-default@sandbox:9090}
      WORKSPACE_EXECUTION_CONCURRENCY: ${WORKSPACE_EXECUTION_CONCURRENCY:-4}
      SANDBOX_HOST: sandbox
      SANDBOX_PORT: "9090"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codecraft}?connectTimeout=2&socketTimeout=3
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      IDENTITY_FINGERPRINT_KEY: ${IDENTITY_FINGERPRINT_KEY:-}
      MODEL_CREDENTIAL_ACTIVE_KEY_ID: ${MODEL_CREDENTIAL_ACTIVE_KEY_ID:-}
      MODEL_CREDENTIAL_KEYS: ${MODEL_CREDENTIAL_KEYS:-}
      MODEL_CREDENTIAL_ROTATION_ENABLED: ${MODEL_CREDENTIAL_ROTATION_ENABLED:-false}
      COPILOT_WEB_API_KEY: ${COPILOT_WEB_API_KEY:-}
      COPILOT_WEB_BASE_URL: ${COPILOT_WEB_BASE_URL:-https://api.tavily.com/}
      COPILOT_WEB_TIMEOUT: ${COPILOT_WEB_TIMEOUT:-20s}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5173}
      SANDBOX_RPC_KEY: ${SANDBOX_RPC_KEY:-}
      PROBLEM_PUBLICATION_FILE: ${JAVA_PUBLICATION_FILE:-}
    volumes:
      - type: bind
        source: ${CONTAINER_INPUTS_DIRECTORY:-./.runtime/container-inputs/unprepared}/publication.json
        target: /app/publication.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${JAVA_PORT:-8080}:8080"
  sandbox: &sandbox
    # Trusted coordinator only: Docker socket access is host-administrator authority.
    group_add: ["${DOCKER_SOCKET_GID:-0}"]
    stop_grace_period: 60s
    image: ${SANDBOX_IMAGE:-codecraft/sandbox:unbuilt}
    pull_policy: never
    platform: linux/amd64
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: &sandbox-env
      SANDBOX_PORT: "9090"
      SANDBOX_RPC_KEY: ${SANDBOX_RPC_KEY:-}
      SANDBOX_EXECUTION_VOLUME: "${COMPOSE_PROJECT_NAME}_sandbox-data"
      SANDBOX_EXECUTION_CONCURRENCY: ${SANDBOX_EXECUTION_CONCURRENCY:-4}
      SANDBOX_COMMAND_NETWORK: "${COMPOSE_PROJECT_NAME}_command-egress"
      SANDBOX_RPC_BIND: "172.29.0.2"
      SANDBOX_EGRESS_PROXY_URL: "http://egress:3128"
      SANDBOX_LLM_HOST_URL: "http://java:8080"
      SANDBOX_EGRESS_LISTEN: "0.0.0.0:3128"
      SANDBOX_EGRESS_ALLOWLIST: ${SANDBOX_EGRESS_ALLOWLIST:-repo.maven.apache.org:443,registry.npmjs.org:443,repo1.maven.org:443}
    networks:
      default:
        ipv4_address: 172.29.0.2
      command-egress:
        ipv4_address: 172.30.0.2
    ports:
      - "127.0.0.1:${SANDBOX_PORT:-9090}:9090"
    volumes:
      - sandbox-data:/var/lib/codecraft
      - /var/run/docker.sock:/docker.sock
      - type: bind
        source: ${CONTAINER_INPUTS_DIRECTORY:-./.runtime/container-inputs/unprepared}/publications.json
        target: /publications.json
        read_only: true
        bind:
          create_host_path: false
  sandbox-secondary:
    <<: *sandbox
    profiles: [sandbox-multi]
    environment:
      <<: *sandbox-env
      SANDBOX_EXECUTION_VOLUME: "${COMPOSE_PROJECT_NAME}_sandbox-secondary-data"
      SANDBOX_COMMAND_NETWORK: "${COMPOSE_PROJECT_NAME}_command-egress-secondary"
      SANDBOX_RPC_BIND: "172.29.0.3"
    ports: []
    networks:
      default:
        ipv4_address: 172.29.0.3
      command-egress-secondary:
        ipv4_address: 172.31.0.2
    volumes:
      - sandbox-secondary-data:/var/lib/codecraft
      - /var/run/docker.sock:/docker.sock
      - type: bind
        source: ${CONTAINER_INPUTS_DIRECTORY:-./.runtime/container-inputs/unprepared}/publications.json
        target: /publications.json
        read_only: true
        bind:
          create_host_path: false
  postgres:
    image: postgres@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codecraft}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.2-alpine
    profiles: [redis]
    # No host port: only trusted services on the Compose network may connect.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", 'test -n "$$REDIS_PASSWORD" || exit 1; exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 64mb --maxmemory-policy noeviction --save "" --appendonly no']
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  rabbitmq:
    image: rabbitmq:4.1.4-alpine
    profiles: [rabbit]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-codecraft}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
    # Refuse an unauthenticated deployment. Never publish broker/management ports to the host.
    entrypoint: ["sh", "-c", 'test -n "$$RABBITMQ_DEFAULT_PASS" || exit 1; exec docker-entrypoint.sh rabbitmq-server']
    hostname: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24
  command-egress:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  command-egress-secondary:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
volumes:
  sandbox-data:
  sandbox-secondary-data:
  rabbitmq-data:
  postgres-data:
