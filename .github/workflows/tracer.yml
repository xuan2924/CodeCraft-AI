name: Layered verification
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '.scratch/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.scratch/**'
  schedule:
    # Daily 03:23 China time: disposable, non-paid golden paths only.
    - cron: '23 19 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: quick = daily development; smoke = nightly; heavy = explicit full regression
        type: choice
        default: quick
        options:
          - quick
          - smoke
          - heavy
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.scope || (github.event_name == 'schedule' && 'smoke' || 'quick') }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Push/PR never start Docker/browser smoke or the heavy regression.
        lane: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.scope) || (github.event_name == 'schedule' && '["smoke"]' || '["quick"]')) }}
    timeout-minutes: ${{ matrix.lane == 'heavy' && 40 || 20 }}
    env:
      # Shared runners need headroom; local quick remains 60s, target remains 30s.
      CODECRAFT_QUICK_TIMEOUT_SECONDS: '180'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.11'
          cache: maven
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.9.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/sandbox/go.sum
      - run: npm install --global npm@11.6.0
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        if: matrix.lane != 'quick'
        working-directory: frontend
      - run: ./scripts/generate-proto.sh
      - run: git diff --exit-code -- backend/sandbox/internal/gen
      # Downloads/first compilation are setup, not warm-cache quick feedback.
      - name: Prepare Java and Go caches
        run: |
          cd backend/server && ./mvnw -B -ntp -DskipTests test-compile
          cd ../sandbox && go test -run '^$' ./...
      - run: node scripts/verify.mjs --quick
        if: matrix.lane == 'quick'
      - name: Build smoke applications
        if: matrix.lane == 'smoke'
        run: |
          cd backend/server && ./mvnw -B -ntp -DskipTests package
          cd ../../frontend && npm run build
      - name: Inspect runner socket permissions
        if: matrix.lane != 'quick'
        run: stat -c 'Docker socket mode=%a uid=%u gid=%g' /var/run/docker.sock
      - name: Golden paths only (synthetic model; no supplier keys)
        if: matrix.lane == 'smoke'
        run: node scripts/test-tracer.mjs --smoke --identity --workspace
      - run: node scripts/verify.mjs --all
        if: matrix.lane == 'heavy'
      - name: Classify startup failure without exposing log contents
        if: failure() && matrix.lane != 'quick'
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          for (const entry of await readdir('.runtime').catch(() => [])) {
            if (!entry.startsWith('cc-tracer-')) continue;
            const text = await readFile(`.runtime/${entry}/sandbox.log`, 'utf8').catch(() => '');
            console.log('[startup-diagnostic]', JSON.stringify({
              socketPermissionDenied: /docker.sock[^\r\n]*permission denied/.test(text),
              publicationPermissionDenied: /published inputs[^\r\n]*permission denied/.test(text),
              permissionDenied: text.includes('permission denied'),
              addressInUse: text.includes('address already in use'),
            }));
          }
          NODE
      # Public repository: no automatic upload of browser traces, .runtime,
      # databases, environment files or other potentially sensitive payloads.
